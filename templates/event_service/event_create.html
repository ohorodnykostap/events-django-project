{% extends "base.html" %}

{% block content %}
<h2>Create Event</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{% url 'events:event-list' %}" class="btn btn-secondary">Cancel</a>
</form>

<script>
    flatpickr("#id_event_datetime", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true
    });
</script>
{% endblock %}
